name: P2 isolated audit transfer

on:
  push:
    branches:
      - codex/p2-performance-quality-audit-20260918
    paths:
      - .github/workflows/p2-audit-transfer.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Archive exact tracked base without credentials or runtime data
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/p2-transfer"
          git archive --format=tar HEAD > "$RUNNER_TEMP/p2-transfer/source.tar"
          git cat-file commit HEAD > "$RUNNER_TEMP/p2-transfer/base.commit"
          git rev-parse HEAD > "$RUNNER_TEMP/p2-transfer/base.sha"
          node --version > "$RUNNER_TEMP/p2-transfer/node-version.txt"
          npm --version > "$RUNNER_TEMP/p2-transfer/npm-version.txt"
      - name: Install exact locked dependencies in isolated runner
        run: npm ci
      - name: Archive runtime for offline audit validation
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/p2-runtime/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/p2-runtime/bin/node"
          cp -a "$(npm root -g)/npm" "$RUNNER_TEMP/p2-runtime/npm"
          tar -czf "$RUNNER_TEMP/p2-transfer/runtime.tar.gz" -C "$RUNNER_TEMP/p2-runtime" .
          tar -czf "$RUNNER_TEMP/p2-transfer/dependencies.tar.gz" node_modules
          cd "$RUNNER_TEMP/p2-transfer"
          sha256sum source.tar base.commit runtime.tar.gz dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p2-offline-audit-base
          path: ${{ runner.temp }}/p2-transfer
          retention-days: 1
          if-no-files-found: error
