services:
  unifi-smarthub:
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_REVISION: ${BUILD_REVISION:-}
        BUILD_CREATED: ${BUILD_CREATED:-}
        BUILD_DIRTY: ${BUILD_DIRTY:-}
        BUILD_IDENTITY_REQUIRED: ${BUILD_IDENTITY_REQUIRED:-false}
    image: ${SMARTHUB_IMAGE:-unifi-smarthub:latest}
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${SMARTHUB_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=3000
      - SMARTHUB_ENV_FILE=/app/config/.env
      # 一般整合設定由 config/.env 載入。Monitor 的整組連線/信任設定刻意固定於
      # container creation，避免 key 輪替途中把舊 credential 送到新 target。
      - NAS_MONITOR_URL=${NAS_MONITOR_URL:-}
      - NAS_MONITOR_API_KEY=${NAS_MONITOR_API_KEY:-}
      - NAS_MONITOR_MODE=${NAS_MONITOR_MODE:-docker_only}
      - NAS_MONITOR_ALLOW_INSECURE_HTTP=${NAS_MONITOR_ALLOW_INSECURE_HTTP:-false}
      - NAS_MONITOR_TLS_INSECURE=${NAS_MONITOR_TLS_INSECURE:-false}
      - NAS_MONITOR_CA_FILE=${NAS_MONITOR_CA_FILE:-}
      - NAS_MONITOR_ALLOW_LEGACY_ACTIONS=${NAS_MONITOR_ALLOW_LEGACY_ACTIONS:-false}
      # 時區：報表排程 (reportHour)、日誌時間戳、UPS 事件時間皆依此；容器預設 UTC 會差 8 小時
      - TZ=${TZ:-Asia/Taipei}
    extra_hosts:
      # Docker Desktop/OrbStack 原生支援；Linux Engine 透過 host-gateway 保留 PPB REST 路徑。
      - "host.docker.internal:host-gateway"
    volumes:
      # 具名 volume：持久化 SQLite、設定與遷移備份 (容器重建不遺失)
      - smarthub-data:/app/data
      # 掛載專用 config 目錄而非單一檔案，讓安全的同目錄 temp+fsync+rename 可成立。
      # 不可改掛整個 repository；create_host_path=false 避免路徑錯誤時建立空目錄。
      - type: bind
        source: ${SMARTHUB_CONFIG_DIR:-./config}
        target: /app/config
        bind:
          create_host_path: false
    networks:
      - default
      - monitor-backplane
    labels:
      # Broker 永遠拒絕操作此 service，即使使用者 allowlist 誤設過寬。
      - com.unifi.smarthub.nas-monitor.protected=true
    # 記憶體限制：此服務為輕量 Node 程序，256MB 足夠；預留下限確保排程穩定
    mem_limit: 256m
    mem_reservation: 128m

  nas-monitor:
    profiles: ["nas-monitor"]
    build:
      context: ./nas-monitor
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_REVISION: ${BUILD_REVISION:-}
        BUILD_CREATED: ${BUILD_CREATED:-}
        BUILD_DIRTY: ${BUILD_DIRTY:-}
        BUILD_IDENTITY_REQUIRED: ${BUILD_IDENTITY_REQUIRED:-false}
    image: ${NAS_MONITOR_IMAGE:-unifi-smarthub-nas-monitor:latest}
    restart: unless-stopped
    stop_grace_period: 20s
    user: "1000:1000"
    environment:
      - PORT=8000
      - NAS_MONITOR_API_KEY=${NAS_MONITOR_API_KEY:-}
      - NAS_MONITOR_MUTATIONS_ENABLED=${NAS_MONITOR_MUTATIONS_ENABLED:-false}
      - NAS_MONITOR_ACTION_ALLOW_IDS=${NAS_MONITOR_ACTION_ALLOW_IDS:-}
      - NAS_MONITOR_ACTION_ALLOW_LABELS=${NAS_MONITOR_ACTION_ALLOW_LABELS:-}
      - NAS_MONITOR_LOGS_ENABLED=${NAS_MONITOR_LOGS_ENABLED:-false}
      - NAS_MONITOR_LOG_ALLOW_IDS=${NAS_MONITOR_LOG_ALLOW_IDS:-}
      - NAS_MONITOR_LOG_ALLOW_LABELS=${NAS_MONITOR_LOG_ALLOW_LABELS:-}
      - NAS_MONITOR_ACTION_STOP_SECONDS=${NAS_MONITOR_ACTION_STOP_SECONDS:-10}
      - NAS_MONITOR_MAX_LIST_RESPONSE_BYTES=${NAS_MONITOR_MAX_LIST_RESPONSE_BYTES:-3145728}
      - DOCKER_SOCKET=/var/run/docker.sock
      - TZ=${TZ:-Asia/Taipei}
    group_add:
      # 設成宿主 Docker socket 的 numeric GID；0 只是 Docker Desktop/OrbStack 常見值。
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      # 即使容器本身是非 root，可寫 Docker socket 仍等同宿主機 root 等級控制權。
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    networks:
      - monitor-backplane
    labels:
      - com.unifi.smarthub.nas-monitor.protected=true
    mem_limit: 96m
    mem_reservation: 32m

volumes:
  smarthub-data:

networks:
  monitor-backplane:
    internal: true
