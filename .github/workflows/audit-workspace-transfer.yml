name: Temporary isolated audit workspace transfer

on:
  push:
    branches:
      - audit/production-readiness-20260916
    paths:
      - .github/workflows/audit-workspace-transfer.yml

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable audit base without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle exact source and its Git history
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-transfer"
          test "$(git rev-parse HEAD)" = 5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          git bundle create "$RUNNER_TEMP/audit-transfer/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/audit-transfer/source.bundle"
      - name: Use repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies in ephemeral runner
        run: npm ci
      - name: Archive isolated test toolchain without config or credentials
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/audit-transfer/node-modules.tar.gz" node_modules
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$node_root" -czf "$RUNNER_TEMP/audit-transfer/node-runtime.tar.gz" bin/node bin/npm bin/npx lib/node_modules/npm
          cd "$RUNNER_TEMP/audit-transfer"
          sha256sum source.bundle node-modules.tar.gz node-runtime.tar.gz > SHA256SUMS
          node --version > node-version.txt
          npm --version > npm-version.txt
      - name: Upload temporary workspace transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-workspace-5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          path: ${{ runner.temp }}/audit-transfer
          if-no-files-found: error
          retention-days: 1
