name: Publish SmartHub images

on:
  workflow_run:
    workflows:
      - SmartHub CI
    types:
      - completed

permissions: {}

concurrency:
  group: smarthub-ghcr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      REVISION: ${{ github.event.workflow_run.head_sha }}
      REF_NAME: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Check out the exact CI head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine whether image publication is required
        id: publish-scope
        shell: bash
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          evidence_count="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("smarthub-release-evidence-")))] | length')"
          if [ "$evidence_count" -eq 1 ]; then
            echo 'run_runtime=true' >> "$GITHUB_OUTPUT"
          elif [ "$evidence_count" -eq 0 ]; then
            echo 'run_runtime=false' >> "$GITHUB_OUTPUT"
          else
            echo "expected at most one release evidence artifact, found $evidence_count" >&2
            exit 1
          fi

      - name: Skip unchanged runtime publication
        if: steps.publish-scope.outputs.run_runtime != 'true'
        run: echo 'No runtime-affecting changes; keeping the existing GHCR image tags.'

      - name: Set up QEMU
        if: steps.publish-scope.outputs.run_runtime == 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: steps.publish-scope.outputs.run_runtime == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: steps.publish-scope.outputs.run_runtime == 'true'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release identity
        id: identity
        if: steps.publish-scope.outputs.run_runtime == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          created="$(git show -s --format=%cI "$REVISION")"
          created_iso="$(node -e 'console.log(new Date(process.argv[1]).toISOString())' "$created")"
          {
            echo "version=$version"
            echo "created=$created_iso"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve image names
        id: images
        if: steps.publish-scope.outputs.run_runtime == 'true'
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-private"
          {
            echo "main=$repository"
            echo "monitor=${repository}-nas-monitor"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse existing non-private packages
        if: steps.publish-scope.outputs.run_runtime == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="${GITHUB_REPOSITORY#*/}-private"
          for name in "$package" "${package}-nas-monitor"; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/users/$owner/packages/container/$name")
            case "$status" in
              404) ;; # New GHCR packages default to private.
              200) jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json" ;;
              *) echo "Package visibility lookup failed: HTTP $status" >&2; exit 1 ;;
            esac
          done

      - name: Resolve release tags
        id: tags
        if: steps.publish-scope.outputs.run_runtime == 'true'
        shell: bash
        env:
          MAIN_IMAGE: ${{ steps.images.outputs.main }}
          MONITOR_IMAGE: ${{ steps.images.outputs.monitor }}
          REF_NAME: ${{ env.REF_NAME }}
          REVISION: ${{ env.REVISION }}
        run: |
          ref_name="${REF_NAME#refs/tags/}"
          case "$ref_name" in
            main)
              release_tag=stable
              ;;
            v[0-9]*)
              if ! printf '%s\n' "$ref_name" | grep -Eq '^v[0-9][A-Za-z0-9_.-]{0,127}$'; then
                echo "Release tag must match v<version>: $ref_name" >&2
                exit 1
              fi
              release_tag="$ref_name"
              ;;
            *)
              # workflow_run.head_branch can be empty for a tag-triggered run.
              # The full checkout lets us resolve the release tag from the
              # exact CI SHA instead of guessing from the workflow_run ref.
              release_tag="$(git tag --points-at "$REVISION" \
                | grep -E '^v[0-9][A-Za-z0-9_.-]{0,127}$' \
                | sort | tail -n 1 || true)"
              [ -n "$release_tag" ] || {
                echo "Refusing to publish unsupported CI ref: $ref_name" >&2
                exit 1
              }
              ;;
          esac
          {
            echo 'main<<TAGS'
            printf '%s\n' "$MAIN_IMAGE:sha-$REVISION"
            printf '%s\n' "$MAIN_IMAGE:$release_tag"
            echo 'TAGS'
            echo 'monitor<<TAGS'
            printf '%s\n' "$MONITOR_IMAGE:sha-$REVISION"
            printf '%s\n' "$MONITOR_IMAGE:$release_tag"
            echo 'TAGS'
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push SmartHub image
        if: steps.publish-scope.outputs.run_runtime == 'true'
        id: build-main
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.main }}
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_REVISION=${{ env.REVISION }}
            BUILD_CREATED=${{ steps.identity.outputs.created }}
            BUILD_DIRTY=false
            BUILD_IDENTITY_REQUIRED=true
          provenance: true
          sbom: true

      - name: Build and push NAS Monitor image
        if: steps.publish-scope.outputs.run_runtime == 'true'
        id: build-monitor
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4 # v6.18.0
        with:
          context: ./nas-monitor
          file: ./nas-monitor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.monitor }}
          build-args: |
            BUILD_VERSION=${{ steps.identity.outputs.version }}
            BUILD_REVISION=${{ env.REVISION }}
            BUILD_CREATED=${{ steps.identity.outputs.created }}
            BUILD_DIRTY=false
            BUILD_IDENTITY_REQUIRED=true
          provenance: true
          sbom: true

      - name: Verify paired packages remain private
        if: steps.publish-scope.outputs.run_runtime == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="${GITHUB_REPOSITORY#*/}-private"
          for name in "$package" "${package}-nas-monitor"; do
            gh api "users/$owner/packages/container/$name" \
              --jq '{name, visibility}' > "$RUNNER_TEMP/package.json"
            jq -e '.visibility == "private"' "$RUNNER_TEMP/package.json"
            cat "$RUNNER_TEMP/package.json"
          done

      - name: Verify authenticated release pulls
        if: steps.publish-scope.outputs.run_runtime == 'true'
        env:
          MAIN_IMAGE: ${{ steps.images.outputs.main }}
          MONITOR_IMAGE: ${{ steps.images.outputs.monitor }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        shell: bash
        run: |
          for name in "$MAIN_IMAGE" "$MONITOR_IMAGE"; do
            docker buildx imagetools inspect "$name:$RELEASE_TAG"
            docker pull --platform linux/amd64 "$name:$RELEASE_TAG"
          done

      - name: Scan exact published multi-arch image digests
        if: steps.publish-scope.outputs.run_runtime == 'true'
        env:
          MAIN_IMAGE: ${{ steps.images.outputs.main }}
          MONITOR_IMAGE: ${{ steps.images.outputs.monitor }}
          MAIN_DIGEST: ${{ steps.build-main.outputs.digest }}
          MONITOR_DIGEST: ${{ steps.build-monitor.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/smarthub-published-scan"
          mkdir -p "$output_dir"
          printf 'main=%s@%s\nmonitor=%s@%s\n' \
            "$MAIN_IMAGE" "$MAIN_DIGEST" "$MONITOR_IMAGE" "$MONITOR_DIGEST" \
            > "$output_dir/release-image-digests.txt"
          images=("$MAIN_IMAGE" "$MONITOR_IMAGE")
          digests=("$MAIN_DIGEST" "$MONITOR_DIGEST")
          names=(smarthub nas-monitor)
          for index in 0 1; do
            reference="${images[$index]}@${digests[$index]}"
            docker buildx imagetools inspect "$reference"
            for platform in linux/amd64 linux/arm64; do
              suffix="${platform#linux/}"
              docker pull --platform "$platform" "$reference"
              local_image="smarthub-release-scan-${names[$index]}:${suffix}"
              docker tag "$reference" "$local_image"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                -v "$output_dir:/out" \
                -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
                aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
                image --format json \
                --output "/out/${names[$index]}-${suffix}.trivy.json" \
                --severity HIGH,CRITICAL "$local_image"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock:ro \
                -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
                aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
                image --exit-code 1 --severity HIGH,CRITICAL "$local_image"
            done
          done

      - name: Upload published image scan reports
        if: success() && steps.publish-scope.outputs.run_runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smarthub-published-image-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/smarthub-published-scan
          if-no-files-found: error
          retention-days: 14
