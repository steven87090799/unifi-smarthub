name: SmartHub CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smarthub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run unit, integration, contract, and security tests
        run: npm test

      - name: Verify checked-in CSS
        run: npm run check:css

      - name: Audit production dependencies
        run: npm audit --audit-level=low

      - name: Prepare isolated Compose configuration
        run: |
          mkdir -p config
          cp .env.example config/.env
          if ! grep -q '^PANEL_PASSWORD=' config/.env; then
            printf '\nPANEL_PASSWORD=ci-only-strong-test-password\n' >> config/.env
          fi
          chmod 700 config
          chmod 600 config/.env
          sudo chown 1000:1000 config config/.env

      - name: Validate Compose profiles
        run: |
          sudo docker compose --env-file config/.env config --quiet
          sudo docker compose --env-file config/.env --profile nas-monitor config --quiet

      - name: Build production images without starting containers
        run: |
          sudo docker compose --env-file config/.env build unifi-smarthub
          sudo docker compose --env-file config/.env --profile nas-monitor build

      - name: Initialize isolated SQLite volume for preflight
        run: |
          sudo docker compose --env-file config/.env run --rm --no-deps \
            unifi-smarthub node -e "const { createHistoryDb } = require('./db'); const db = createHistoryDb(process.env.DATA_DIR); db.close();"

      - name: Run isolated production preflight
        run: |
          sudo docker compose --env-file config/.env run --rm --no-deps \
            unifi-smarthub node scripts/production-preflight.js --offline

      - name: Run isolated production runtime smoke test
        run: npm run test:smoke
        timeout-minutes: 5

      - name: Run blocking short runtime soak
        run: SOAK_TEST_DURATION_MS=90000 SOAK_TEST_TICK_MS=20 npm run test:soak
        timeout-minutes: 5

      - name: Generate SBOM and scan built images
        run: |
          mkdir -p "$RUNNER_TEMP/smarthub-sbom"
          for image in unifi-smarthub:dev unifi-smarthub-nas-monitor:dev; do
            safe_name="${image%%:*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/smarthub-sbom:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --format cyclonedx --output "/out/${safe_name}.cdx.json" "$image"
            # Keep fixed and unfixed HIGH/CRITICAL findings visible in the
            # downloadable machine-readable report. The blocking scan below
            # applies the same strict policy to both states.
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/smarthub-sbom:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --format json --output "/out/${safe_name}.trivy.json" --severity HIGH,CRITICAL "$image"
          done
          for image in unifi-smarthub:dev unifi-smarthub-nas-monitor:dev; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done

      - name: Verify repository hygiene
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"

      - name: Generate exact-head release evidence
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/smarthub-sbom"
          RELEASE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          SMART_HUB_NODE_VERSION="$(node -p 'process.version')" \
          SMART_HUB_IMAGE_ID="$(docker image inspect unifi-smarthub:dev --format '{{.Id}}')" \
          NAS_MONITOR_IMAGE_ID="$(docker image inspect unifi-smarthub-nas-monitor:dev --format '{{.Id}}')" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const evidence = {
            repository: process.env.GITHUB_REPOSITORY,
            head_sha: process.env.RELEASE_HEAD_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_number: process.env.GITHUB_RUN_NUMBER,
            node_version: process.env.SMART_HUB_NODE_VERSION,
            smartHub_image: 'unifi-smarthub:dev',
            nas_monitor_image: 'unifi-smarthub-nas-monitor:dev',
            smartHub_image_id: process.env.SMART_HUB_IMAGE_ID,
            nas_monitor_image_id: process.env.NAS_MONITOR_IMAGE_ID,
            sbom_files: ['unifi-smarthub.cdx.json', 'unifi-smarthub-nas-monitor.cdx.json'],
            trivy_files: ['unifi-smarthub.trivy.json', 'unifi-smarthub-nas-monitor.trivy.json'],
            trivy_blocking_policy: 'HIGH,CRITICAL including unfixed',
            created_at: new Date().toISOString()
          };
          fs.writeFileSync(
              path.join(process.env.RUNNER_TEMP, 'smarthub-sbom', 'release-evidence.json'),
              `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 }
          );
          NODE

      - name: Validate release evidence
        if: success()
        run: |
          RELEASE_HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          SMART_HUB_IMAGE_ID="$(docker image inspect unifi-smarthub:dev --format '{{.Id}}')" \
          NAS_MONITOR_IMAGE_ID="$(docker image inspect unifi-smarthub-nas-monitor:dev --format '{{.Id}}')" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.join(process.env.RUNNER_TEMP, 'smarthub-sbom');
          const evidence = JSON.parse(fs.readFileSync(path.join(root, 'release-evidence.json'), 'utf8'));
          if (evidence.head_sha !== process.env.RELEASE_HEAD_SHA) throw new Error('release evidence head_sha is not the exact PR head');
          if (evidence.smartHub_image_id !== process.env.SMART_HUB_IMAGE_ID
              || evidence.nas_monitor_image_id !== process.env.NAS_MONITOR_IMAGE_ID) {
            throw new Error('release evidence image IDs do not match the inspected images');
          }
          if (!/^sha256:[0-9a-f]{64}$/.test(evidence.smartHub_image_id)
              || !/^sha256:[0-9a-f]{64}$/.test(evidence.nas_monitor_image_id)) {
            throw new Error('release evidence image IDs are invalid');
          }
          for (const file of [...evidence.sbom_files, ...evidence.trivy_files]) {
            const target = path.join(root, file);
            if (!fs.statSync(target).isFile() || fs.statSync(target).size === 0) throw new Error(`release evidence report is missing or empty: ${file}`);
          }
          NODE

      - name: Upload SBOM and vulnerability reports
        if: success()
        id: upload-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarthub-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/smarthub-sbom
          if-no-files-found: error
          retention-days: 14

      - name: Capture CI diagnostics on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/smarthub-ci-diagnostics"
          {
            echo "workflow=${GITHUB_WORKFLOW} run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA}"
            git status --short --untracked-files=all || true
            docker image ls --no-trunc || true
          } > "$RUNNER_TEMP/smarthub-ci-diagnostics/ci-diagnostics.txt"

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smarthub-ci-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/smarthub-ci-diagnostics
          if-no-files-found: error
          retention-days: 14
