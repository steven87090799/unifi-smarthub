name: SmartHub CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smarthub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run unit, integration, contract, and security tests
        run: npm test

      - name: Verify checked-in CSS
        run: npm run check:css

      - name: Audit production dependencies
        run: npm audit --audit-level=low

      - name: Prepare isolated Compose configuration
        run: |
          mkdir -p config
          cp .env.example config/.env
          if ! grep -q '^PANEL_PASSWORD=' config/.env; then
            printf '\nPANEL_PASSWORD=ci-only-strong-test-password\n' >> config/.env
          fi

      - name: Validate Compose profiles
        run: |
          docker compose --env-file config/.env config --quiet
          docker compose --env-file config/.env --profile nas-monitor config --quiet

      - name: Build production images without starting containers
        run: |
          docker compose --env-file config/.env build unifi-smarthub
          docker compose --env-file config/.env --profile nas-monitor build

      - name: Run isolated production runtime smoke test
        run: npm run test:smoke
        timeout-minutes: 5

      - name: Run blocking short runtime soak
        run: SOAK_DURATION_MS=90000 npm run test:soak
        timeout-minutes: 5

      - name: Generate SBOM and scan built images
        run: |
          mkdir -p "$RUNNER_TEMP/smarthub-sbom"
          for image in unifi-smarthub:dev unifi-smarthub-nas-monitor:dev; do
            safe_name="${image%%:*}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/smarthub-sbom:/out" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --format cyclonedx --output "/out/${safe_name}.cdx.json" "$image"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
              aquasec/trivy@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e \
              image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$image"
          done

      - name: Verify repository hygiene
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no)"
