services:
  unifi-smarthub:
    build: .
    image: unifi-smarthub:latest
    container_name: unifi-smarthub
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      # 時區：報表排程 (reportHour)、日誌時間戳、UPS 事件時間皆依此；容器預設 UTC 會差 8 小時
      - TZ=Asia/Taipei
    volumes:
      # 具名 volume：持久化歷史趨勢、封鎖紀錄、資安設定 (容器重建不遺失)
      - smarthub-data:/app/data
      # bind mount .env：讓「設定 → 連線設定」網頁修改的連線資訊寫回宿主機，容器重建不遺失
      # (.dockerignore 排除了 .env，若不掛載，網頁上改的設定會在重建後消失)
      - ./.env:/app/.env
    # 記憶體限制：此服務為輕量 Node 程序，256MB 足夠；預留下限確保排程穩定
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  smarthub-data:
