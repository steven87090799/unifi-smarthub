name: P2 isolated verified patch application

on:
  push:
    branches:
      - codex/p2-performance-quality-audit-20260918
    paths:
      - .github/workflows/p2-audit-apply.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply the locally tested tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/p2-performance-quality-audit-20260918
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 5db2b72d86ada93f46297e4d974f7dcedb93dcaa HEAD
          cat .github/p2-audit-transfer/part-{1,2,3,4,5} > "$RUNNER_TEMP/p2-audit.patch.xz"
          echo "37866a7b92653c97c9344a9f81db634365c64060b5b0b567d6c68defe1feb6bd  $RUNNER_TEMP/p2-audit.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/p2-audit.patch.xz" > "$RUNNER_TEMP/p2-audit.patch"
          git apply --index --check "$RUNNER_TEMP/p2-audit.patch"
          git apply --index "$RUNNER_TEMP/p2-audit.patch"
          git rm -r .github/p2-audit-transfer
          cp .git/index "$RUNNER_TEMP/p2-audit.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/p2-audit.index" git update-index --force-remove .github/workflows/p2-audit-transfer.yml .github/workflows/p2-audit-apply.yml
          actual_tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/p2-audit.index" git write-tree)
          test "$actual_tree" = 13c59e19527ccdef79f5cf55a09dd0ceeb8fa3d0
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: bound SQLite cleanup and frontend background work' -m 'Apply the exact independently tested P2/P3 tree; add 38 regression cases, real synthetic performance evidence and the Traditional Chinese audit report.'
          git push origin HEAD:refs/heads/codex/p2-performance-quality-audit-20260918
          printf 'Implementation HEAD: %s\nVerified final tree without temporary transport workflows: %s\n' "$(git rev-parse HEAD)" "$actual_tree" >> "$GITHUB_STEP_SUMMARY"
