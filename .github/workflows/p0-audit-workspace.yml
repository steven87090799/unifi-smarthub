name: Isolated P0 audit workspace

on:
  push:
    branches:
      - codex/p0-release-blocker-audit-20260918
    paths:
      - .github/workflows/p0-audit-workspace.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact audit base without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          fetch-depth: 0
          persist-credentials: false
      - name: Install repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies in isolated runner
        run: npm ci
      - name: Package source and isolated test runtime only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5db2b72d86ada93f46297e4d974f7dcedb93dcaa
          out="$RUNNER_TEMP/p0-audit-workspace"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD
          tar -czf "$out/node-modules.tar.gz" node_modules
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          tar -czf "$out/node-runtime.tar.gz" -C "$node_root" bin lib include share
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            node --version
            npm --version
          } > "$out/identity.txt"
          cd "$out"
          sha256sum source.bundle node-modules.tar.gz node-runtime.tar.gz identity.txt > SHA256SUMS
      - name: Upload temporary source transfer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smarthub-p0-workspace-20260918
          path: ${{ runner.temp }}/p0-audit-workspace
          if-no-files-found: error
          retention-days: 1
