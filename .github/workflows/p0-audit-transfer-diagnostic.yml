name: Diagnose P0 transfer integrity
on:
  push:
    branches: [codex/p0-release-blocker-audit-20260918]
    paths: [.github/workflows/p0-audit-transfer-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact transferred bytes and Git identity
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p0-transfer"
          mkdir -p "$out"
          cp .github/workflows/p0-audit-delivery.yml "$out/delivery.yml"
          git rev-parse HEAD > "$out/head.txt"
          git bundle create "$out/source.bundle" HEAD
          sha256sum "$out/delivery.yml" "$out/source.bundle" > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-transfer-diagnostic
          path: ${{ runner.temp }}/p0-transfer
          if-no-files-found: error
          retention-days: 1
