services:
  # Explicit local/CI build overlay. Production/NAS must use the base
  # docker-compose.yml and pull the already-built registry images instead.
  unifi-smarthub:
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_REVISION: ${BUILD_REVISION:-}
        BUILD_CREATED: ${BUILD_CREATED:-}
        BUILD_DIRTY: ${BUILD_DIRTY:-}
        BUILD_IDENTITY_REQUIRED: ${BUILD_IDENTITY_REQUIRED:-false}
    image: unifi-smarthub:dev
    environment:
      # CI may explicitly override the panel transport for a loopback-only
      # HTTP smoke after production preflight has validated the real policy.
      PANEL_REQUIRE_HTTPS: ${CI_PANEL_REQUIRE_HTTPS:-${PANEL_REQUIRE_HTTPS:-}}
      PANEL_ALLOW_INSECURE_HTTP: ${CI_PANEL_ALLOW_INSECURE_HTTP:-${PANEL_ALLOW_INSECURE_HTTP:-}}
      PANEL_PASSWORD: ${CI_PANEL_PASSWORD:-${PANEL_PASSWORD:-}}
      PANEL_READONLY_USERNAME: ${CI_PANEL_READONLY_USERNAME:-${PANEL_READONLY_USERNAME:-}}
      PANEL_READONLY_PASSWORD: ${CI_PANEL_READONLY_PASSWORD:-${PANEL_READONLY_PASSWORD:-}}

  nas-monitor:
    build:
      context: ./nas-monitor
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        BUILD_REVISION: ${BUILD_REVISION:-}
        BUILD_CREATED: ${BUILD_CREATED:-}
        BUILD_DIRTY: ${BUILD_DIRTY:-}
        BUILD_IDENTITY_REQUIRED: ${BUILD_IDENTITY_REQUIRED:-false}
    image: unifi-smarthub-nas-monitor:dev
